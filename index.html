<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Simulador interativo das jornadas do candidato e do administrador no BARD RH.">
    <title>Simulador de jornadas — BARD RH</title>
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css?v=5.3.8">
    <link rel="stylesheet" href="../css/app.css?v=20260816-bootstrap">
    <link rel="stylesheet" href="css/simulador.css?v=1">
</head>
<body>
    <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>
    <div id="app" aria-live="polite"></div>

    <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="appModalTitle">Confirmação</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="appModalBody"></div>
                <div class="modal-footer" id="appModalFooter"></div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <script src="../assets/bootstrap/bootstrap.bundle.min.js?v=5.3.8"></script>
    <script src="js/data.js?v=1"></script>
    <script src="js/state.js?v=1"></script>
    <script src="js/router.js?v=1"></script>
    <script src="js/views.js?v=1"></script>
    <script src="js/app.js?v=1"></script>

</html>
